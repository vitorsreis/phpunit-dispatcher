name: Feature request
description: Propose an improvement to PHPUnit Dispatcher.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is blocked or inefficient today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the command syntax, cache behavior, compatibility impact, or packaging change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention existing commands, wrappers, or simpler approaches you considered.
  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Add sample commands, configuration, or expected output.
